name: Auto-Generate Missing Source Maps

on:
  push:
    branches:
      - main
    paths:
      - '**.min.js' # Trigger hanya jika file .min.js berubah/baru
  workflow_dispatch: # Bisa dijalankan manual

jobs:
  fix-maps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js & Install Terser
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g terser

      - name: Detect & Generate Missing Maps
        run: |
          echo "🔍 Scanning for .min.js files missing their source maps..."
          
          # Cari semua file .min.js
          find . -type f -name "*.min.js" -not -path "*/node_modules/*" | while read -r min_file; do
            source_file="${min_file%.min.js}.js"
            map_file="${min_file}.map"

            # 1. Skip jika file sumber (.js) tidak ada
            if [ ! -f "$source_file" ]; then
              echo "⚠️  Skip $(basename $min_file): Source file not found."
              continue
            fi

            # 2. Skip jika source map SUDAH ADA (Sesuai permintaan Anda)
            if [ -f "$map_file" ]; then
              echo "⏭️  Skip $(basename $min_file): Map already exists."
              continue
            fi

            # 3. Generate Source Map SAJA
            echo "⚙️  Generating map for: $(basename $min_file)"
            
            # Kita jalankan terser pada file SUMBER (.js)
            # Output kode minified dibuang ke /dev/null (kita pakai versi dari GitMoire)
            # Output source map disimpan ke .map
            terser "$source_file" \
              -o /dev/null \
              --compress drop_console=false,toplevel=true \
              --mangle toplevel=true,reserved=['Raa','RaaTemplate','window','document'] \
              --format comments=/@license|@preserve|RaaJS|ANATOMI|CHANGELOG|v\d+\.\d+/,ascii_only=false \
              --source-map "url=$(basename $map_file),filename=$(basename $source_file),includeSources=false,content=$map_file" \
              && echo "✅ Created: $(basename $map_file)" \
              || echo "❌ Failed: $(basename $min_file)"
          done

      - name: Commit New Source Maps
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: add missing source maps [skip ci]"
          file_pattern: '*.min.js.map'
          commit_options: '--no-verify'
