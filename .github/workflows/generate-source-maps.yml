name: Auto-Generate Missing Source Maps

on:
  push:
    branches:
      - main
    paths:
      - '**.min.js'
  workflow_dispatch:

jobs:
  fix-maps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    # 1. HAPUS atau komentari baris env di bawah ini jika sudah update versi action.
    # Baris ini tadinya dipakai sistem untuk memaksa jalan di Node 24.
    # env:
    #   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 2. UBAH: actions/checkout@v4 menjadi @v6 (Mendukung Node 24 bawaan)
      - name: Checkout Repository
        uses: actions/checkout@v6

      # 3. UBAH: actions/setup-node@v4 menjadi @v6 (Mendukung Node 24 bawaan)
      - name: Setup Node.js & Install Terser
        uses: actions/setup-node@v6
        with:
          node-version: '24' # 4. UBAH: Naikkan dari '20' ke '22' atau '24' (Node 20 sudah deprecated)
      - run: npm install -g terser

      # --- Bagian script di bawah ini TETAP SAMA (Tidak ada yang perlu diubah) ---
      - name: Detect & Generate Missing Maps
        run: |
          echo "🔍 Scanning for .min.js files missing their source maps..."
          find . -type f -name "*.min.js" -not -path "*/node_modules/*" | while read -r min_file; do
            source_file="${min_file%.min.js}.js"
            map_file="${min_file}.map"

            if [ ! -f "$source_file" ]; then
              echo "⚠️  Skip $(basename $min_file): Source file not found."
              continue
            fi

            if [ -f "$map_file" ]; then
              echo "⏭️  Skip $(basename $min_file): Map already exists."
              continue
            fi

            echo "⚙️  Generating map for: $(basename $min_file)"
            
            terser "$source_file" \
              -o /dev/null \
              --compress drop_console=false,toplevel=true \
              --mangle toplevel=true,reserved=['Raa','RaaTemplate','window','document'] \
              --format comments=/@license|@preserve|RaaJS|ANATOMI|CHANGELOG|v\d+\.\d+/,ascii_only=false \
              --source-map "url=$(basename $map_file),filename=$(basename $source_file),includeSources=false,content=$map_file" \
              && echo "✅ Created: $(basename $map_file)" \
              || echo "❌ Failed: $(basename $min_file)"
          done

      # 5. UBAH: git-auto-commit-action@v5 menjadi @v6 (Versi terbaru untuk kompatibilitas Node 24)
      - name: Commit New Source Maps
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: add missing source maps [skip ci]"
          file_pattern: '*.min.js.map'
          commit_options: '--no-verify'
