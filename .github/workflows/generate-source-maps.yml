name: Auto-Generate Missing Source Maps

on:
  push:
    branches:
      - main
    paths:
      - '**.min.js'
      - '!**.min.js.map'
  workflow_dispatch:

jobs:
  generate-maps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Terser
        run: npm install -g terser

      - name: Generate Missing Source Maps (Node Script)
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          console.log('🔍 Scanning for .min.js files without maps...');
          
          // Fungsi rekursif untuk mencari file
          function walkDir(dir, callback) {
            fs.readdirSync(dir).forEach(f => {
              let dirPath = path.join(dir, f);
              let isDirectory = fs.statSync(dirPath).isDirectory();
              if (isDirectory && f !== 'node_modules' && !f.startsWith('.')) {
                walkDir(dirPath, callback);
              } else {
                callback(path.join(dir, f));
              }
            });
          }

          let count = 0;
          walkDir('.', (filePath) => {
            if (!filePath.endsWith('.min.js')) return;
            
            const mapPath = filePath + '.map';
            const sourcePath = filePath.replace('.min.js', '.js');

            // 1. Skip jika source asli tidak ada
            if (!fs.existsSync(sourcePath)) {
              console.log(\`⚠️  Skip \${filePath} (source .js not found)\`);
              return;
            }

            // 2. Skip jika map sudah ada
            if (fs.existsSync(mapPath)) {
              console.log(\`⏭️  Map exists: \${path.basename(mapPath)}\`);
              return;
            }

            console.log(\`⚙️  Generating map for: \${filePath}\`);
            
            try {
              // Jalankan Terser CLI untuk regenerate .min.js DAN .map sekaligus
              // Penting: Kita regenerate .min.js juga agar sinkron dengan map
              const cmd = \`terser "\${sourcePath}" -o "\${filePath}" --compress drop_console=false,toplevel=true --mangle toplevel=true,reserved=['Raa','RaaTemplate','window','document'] --format comments=/@license|@preserve|RaaJS|ANATOMI|CHANGELOG|v\\\\d+\\\\.\\\\d+/,ascii_only=false --source-map \"url=\${path.basename(mapPath)},filename=\${path.basename(sourcePath)},includeSources=false\"\`;
              
              execSync(cmd, { stdio: 'inherit' });
              
              if (fs.existsSync(mapPath)) {
                console.log(\`✅ Created: \${path.basename(mapPath)}\`);
                count++;
              } else {
                console.error(\`❌ Failed to create map for \${filePath}\`);
              }
            } catch (e) {
              console.error(\`❌ Error processing \${filePath}: \${e.message}\`);
            }
          });

          console.log(\`\\n✨ Done. Generated \${count} new source maps.\`);
          "

      - name: Commit & Push New Maps
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-generate missing source maps [skip ci]"
          file_pattern: '*.min.js.map *.min.js' # Commit both to ensure sync
          commit_options: '--no-verify'
